[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n24sal"
version = "0.0.1"
description = "Non-parametric circadian rhythm analysis (NPCRA) and N24 reconstruction from portable actigraphy data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moncef", email = "ids.mfafi@gmail.com" }]
keywords = [
    "actigraphy",
    "chronobiology",
    "non-24",
    "circadian-rhythm",
    "npcra",
    "samsung-health",
    "datasaillance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "python-dateutil>=2.8",
    "plotly>=5.18",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "kaleido>=0.2",
]
stats = [
    "statsmodels>=0.14",
    "pingouin>=0.5",
]
dashboard = [
    "streamlit>=1.30",
]
oracle = [
    "pyActigraphy>=1.2",
]
ml = [
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "ipykernel>=6.27",
    "jupyterlab>=4.0",
]

[project.urls]
Documentation = "https://github.com/LyonMoncef/n24-data-saillance"
Repository = "https://github.com/LyonMoncef/n24-data-saillance"

[tool.hatch.build.targets.wheel]
packages = ["src/n24sal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marque les tests lents (deselect avec '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-length géré par formatter

[tool.ruff.format]
quote-style = "double"
